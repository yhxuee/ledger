name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run XCTest suite
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .app without signing
        run: |
          set -euo pipefail

          xcodebuild clean build \
            -project WalletLedger.xcodeproj \
            -scheme WalletLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify build products
        run: |
          set -euo pipefail

          APP_PATH="$(find ./build_output/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name 'WalletLedger.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::WalletLedger.app was not produced."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          WIDGET_PATH="$APP_PATH/PlugIns/WalletLedgerWidget.appex"

          if [ ! -d "$WIDGET_PATH" ]; then
            echo "::error::WalletLedgerWidget.appex is not embedded in WalletLedger.app."
            exit 1
          fi

          echo "WalletLedger.app found at: $APP_PATH"
          echo "WalletLedgerWidget.appex is embedded."

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          rm -rf Payload WalletLedger-unsigned.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/WalletLedger.app

          zip -qry WalletLedger-unsigned.ipa Payload

          test -f WalletLedger-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalletLedger-Unsigned-IPA
          path: WalletLedger-unsigned.ipa
          if-no-files-found: error

  # Optional XCTest job. Manual workflow_dispatch only, and only when run_tests is enabled.
  # It is fully independent of `build`: a red test job can never block or delete the
  # successfully produced WalletLedger-Unsigned-IPA artifact.
  tests:
    name: Run XCTest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == true }}
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find iOS Simulator
        run: |
          set -euo pipefail

          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)

          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit(0)

          raise SystemExit("No available iPhone simulator found")
          '
          )"

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run WalletLedger tests
        run: |
          set -euo pipefail

          xcodebuild test \
            -project WalletLedger.xcodeproj \
            -scheme WalletLedger \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:WalletLedgerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalletLedger-Test-Results
          path: TestResults.xcresult
          if-no-files-found: ignore

  # Produces a SIGNED IPA whose app and widget keep the App Group entitlement, then verifies
  # the built binaries. Skipped (with a warning) until the signing secrets are configured.
  signed-ipa:
    name: Build Signed IPA (optional)
    runs-on: macos-latest
    env:
      SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_CONNECT_KEY_P8 }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

    steps:
      - name: Explain missing signing configuration
        if: env.SIGNING_CERTIFICATE_P12 == ''
        run: |
          echo "::warning::Signed build skipped. Add repository secrets to enable runtime App Group verification:"
          echo "  IOS_SIGNING_CERTIFICATE_P12, IOS_SIGNING_CERTIFICATE_PASSWORD, IOS_KEYCHAIN_PASSWORD,"
          echo "  APPLE_DEVELOPMENT_TEAM, APPSTORE_CONNECT_KEY_ID, APPSTORE_CONNECT_ISSUER_ID, APPSTORE_CONNECT_KEY_P8"
          echo "Also enable App Groups (group.org.medx.WalletLedger) for BOTH bundle IDs in the Apple Developer portal:"
          echo "  org.medx.WalletLedger and org.medx.WalletLedger.Widget"

      - name: Checkout repository
        if: env.SIGNING_CERTIFICATE_P12 != ''
        uses: actions/checkout@v4

      - name: Verify Purchase Mode source configuration
        if: env.SIGNING_CERTIFICATE_P12 != ''
        run: bash Scripts/verify-purchase-configuration.sh

      - name: Import signing identity
        if: env.SIGNING_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build signed app with App Group entitlements
        if: env.SIGNING_CERTIFICATE_P12 != ''
        run: |
          xcodebuild clean build \
            -scheme "WalletLedger" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_signed \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic

      - name: Verify signed App Group entitlements on both products
        if: env.SIGNING_CERTIFICATE_P12 != ''
        run: |
          APP="$(find ./build_signed/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          bash Scripts/verify-app-group-entitlements.sh "$APP"

      - name: Package signed IPA
        if: env.SIGNING_CERTIFICATE_P12 != ''
        run: |
          mkdir -p Payload
          cp -r ./build_signed/Build/Products/Release-iphoneos/*.app Payload/
          zip -r WalletLedger-signed.ipa Payload

      - name: Upload signed IPA artifact
        if: env.SIGNING_CERTIFICATE_P12 != ''
        uses: actions/upload-artifact@v4
        with:
          name: WalletLedger-Signed-IPA
          path: WalletLedger-signed.ipa
