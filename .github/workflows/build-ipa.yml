name: Build Unsigned IPA

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键运行
  push:
    branches: [ main, master ] # push 代码时自动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .app without signing
        run: |
          # 自动获取工程中的第一个 scheme（通常是 WalletLedger）
          SCHEME=$(xcodebuild -list -json | tr '\n' ' ' | sed 's/.*"schemes":\s*\[\s*"\([^"]*\)".*/\1/')
          echo "Using scheme: $SCHEME"

          # 强制关闭签名构建真机架构产物
          xcodebuild clean build \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 将生成的 .app 移动至 Payload 目录
          cp -r ./build_output/Build/Products/Release-iphoneos/*.app Payload/
          # 压缩生成 ipa
          zip -r WalletLedger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalletLedger-IPA
          path: WalletLedger.ipa
