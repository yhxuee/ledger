name: Build Finsy

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload signed build to TestFlight
        type: boolean
        default: false
      run_tests:
        description: Run XCTest suite
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  signed-ipa:
    name: Archive and export signed IPA
    runs-on: macos-latest
    env:
      SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_CONNECT_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check signing configuration
        run: |
          set -euo pipefail
          for entry in \
            IOS_SIGNING_CERTIFICATE_P12:SIGNING_CERTIFICATE_P12 \
            IOS_SIGNING_CERTIFICATE_PASSWORD:SIGNING_CERTIFICATE_PASSWORD \
            IOS_KEYCHAIN_PASSWORD:KEYCHAIN_PASSWORD \
            APPLE_DEVELOPMENT_TEAM:DEVELOPMENT_TEAM \
            APPSTORE_CONNECT_KEY_ID:ASC_KEY_ID \
            APPSTORE_CONNECT_ISSUER_ID:ASC_ISSUER_ID \
            APPSTORE_CONNECT_KEY_P8:ASC_KEY_P8; do
            name="${entry%%:*}"
            variable="${entry#*:}"
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - name: Verify capability source configuration
        run: bash Scripts/verify-purchase-configuration.sh
      - name: Import signing identity and API key
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/finsy-signing.keychain-db"
          certificate="$RUNNER_TEMP/finsy-signing.p12"
          key="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution:' || {
            echo '::error::No Apple Distribution signing identity was imported.'
            exit 1
          }
          echo 'Apple Distribution identity detected.'
          mkdir -p "$(dirname "$key")"
          printf '%s' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          rm -f "$certificate"
      - name: Resolve App Store distribution provisioning profiles
        env:
          IOS_APPSTORE_PROFILE_APP: ${{ secrets.IOS_APPSTORE_PROFILE_APP }}
          IOS_APPSTORE_PROFILE_WIDGET: ${{ secrets.IOS_APPSTORE_PROFILE_WIDGET }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/signing_venv"
          "$RUNNER_TEMP/signing_venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/signing_venv/bin/python" Scripts/resolve-distribution-profiles.py
      - name: Archive Finsy
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -project Finsy.xcodeproj \
            -scheme Finsy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Finsy.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            APP_PROFILE_SPECIFIER="$APP_PROFILE_NAME" \
            WIDGET_PROFILE_SPECIFIER="$WIDGET_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Verify archived app and widget
        run: |
          bash Scripts/verify-signed-distribution.sh \
            "$RUNNER_TEMP/Finsy.xcarchive/Products/Applications/Finsy.app" \
            "$DEVELOPMENT_TEAM" "$BUILD_NUMBER"
      - name: Export signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          options = {
              'method': 'app-store-connect',
              'signingStyle': 'manual',
              'teamID': os.environ['DEVELOPMENT_TEAM'],
              'destination': 'export',
              'manageAppVersionAndBuildNumber': False,
              'provisioningProfiles': {
                  'com.finsy.app': os.environ['APP_PROFILE_NAME'],
                  'com.finsy.app.Widget': os.environ['WIDGET_PROFILE_NAME'],
              },
          }
          (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Finsy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          test -s "$RUNNER_TEMP/export/Finsy.ipa"
      - name: Verify exported signature and profiles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-inspection"
          ditto -x -k "$RUNNER_TEMP/export/Finsy.ipa" "$RUNNER_TEMP/ipa-inspection"
          bash Scripts/verify-signed-distribution.sh \
            "$RUNNER_TEMP/ipa-inspection/Payload/Finsy.app" \
            "$DEVELOPMENT_TEAM" "$BUILD_NUMBER" production
      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finsy-Signed-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/export/Finsy.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Set :destination upload' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Finsy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/testflight-upload" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/finsy-signing.p12" "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          security delete-keychain "$RUNNER_TEMP/finsy-signing.keychain-db" 2>/dev/null || true

  tests:
    name: Run XCTest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == true }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for device in devices if "iPhone" in device["name"]))')"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run Finsy tests
        run: |
          xcodebuild test \
            -project Finsy.xcodeproj \
            -scheme Finsy \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:FinsyTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
