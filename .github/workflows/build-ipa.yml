name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      reproduce_original_analytics:
        description: Run the rendering test against the pre-fix Analytics view
        type: boolean
        default: false
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original Analytics for crash reproduction
        if: inputs.reproduce_original_analytics == true
        run: git show dabddfd:WalletLedger/Features/Analytics/AnalyticsView.swift > WalletLedger/Features/Analytics/AnalyticsView.swift

      - name: Render Analytics on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test \
            -scheme WalletLedger \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:WalletLedgerTests/AnalyticsRenderingTests \
            -parallel-testing-enabled NO \
            -resultBundlePath AnalyticsRendering.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Analytics test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Analytics-Rendering-Results
          path: AnalyticsRendering.xcresult

      - name: Build .app without signing
        run: |
          xcodebuild clean build \
            -scheme "WalletLedger" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 复制生成的 .app 到 Payload 目录
          cp -r ./build_output/Build/Products/Release-iphoneos/*.app Payload/
          # 压缩生成 ipa
          zip -r WalletLedger.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalletLedger-IPA
          path: WalletLedger.ipa
